name: Local application checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install uv
          python -m uv sync --locked
          npm ci --prefix frontend
      - name: Python lint and formatting
        run: |
          python -m uv run python -m ruff check .
          python -m uv run python -m ruff format --check .
      - name: Python tests (local fixtures only)
        run: python -m uv run python -m pytest -q
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
